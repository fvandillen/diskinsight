name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without v (for example, 1.0.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diskinsight-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        env:
          VERSION: ${{ inputs.version }}
        run: ./Scripts/package_release.sh "$VERSION"
      - name: Smoke test
        run: |
          swift build -c release
          ./Scripts/smoke_test.sh "$(swift build -c release --show-bin-path)/DiskInsight"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            "build/DiskInsight-$VERSION-arm64.zip" \
            "build/DiskInsight-$VERSION-arm64.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "DiskInsight $VERSION" \
            --generate-notes \
            --notes "Requires macOS 14 or later and Apple Silicon. This build is ad-hoc signed, not notarized. See the README for macOS first-launch approval and Homebrew installation."
